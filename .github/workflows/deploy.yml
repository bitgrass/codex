name: Deploy (OpenNext -> Cloudflare)

on:
  push:
    branches: ["staking"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: codex-dep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile
        env:
          YARN_NETWORK_TIMEOUT: "600000"

      - name: Create .env from secret
        run: |
          # Write secret contents exactly (preserve newlines)
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          # Export variables for all subsequent steps
          while IFS= read -r line || [ -n "$line" ]; do
            # Trim leading spaces
            line="${line#"${line%%[![:space:]]*}"}"
            # Skip empty lines and comments
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue ;;
              export\ *) line="${line#export }" ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < .env

      - name: Check env (no secrets)
        run: |
          echo "NEXT_PUBLIC_THIRDWEB_CLIENT_ID set: ${NEXT_PUBLIC_THIRDWEB_CLIENT_ID:+yes}"

      - name: Build OpenNext bundle
        run: |
          set -a
          source .env
          set +a
          yarn opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        run: |
          set -a
          source .env
          set +a
          yarn opennextjs-cloudflare deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
